# Sanitized performance fixture, not an installable security-policy recommendation.
# Preserves 193 Bash rules, 165 tool rules, and 106 fragments from the profiled policy.
# Personal identifiers, rule names, reasons, and comments were removed or replaced.
bash_path_aliases = [
  "B",
  "D",
  "F",
  "P",
  "R",
  "S",
  "SCRATCH",
  "SP",
  "W",
  "f",
  "src",
]

[pattern_fragments]
git_read_ops = "(status|diff|log|show|branch|remote|tag|ls-files|cat-file|check-attr|rev-parse|ls-remote)"
git_write_ops = "(commit|push|pull|rebase|merge|checkout|switch|reset)"
git_globals = "( -C ({{safe_relative_path}}|\\.))?"
cargo_safe_ops = "(nextest run|build|check|test|fmt|clippy|doc|clean|tree)"
jj_read_ops = "(status|st|diff|log|show|root|evolog|help)"
jj_globals = "( --ignore-working-copy| (-R|--repository) {{safe_relative_path}})*"
jj_bookmark_glob = "({{rg_quoted_pattern}}|{{safe_relative_path}})"
package_safe_ops = "(build|lint|test|typecheck|check|format|fmt)"
npm_test_args = "( --workspace(=| ){{safe_relative_path}})? -- {{safe_relative_path}}( {{safe_relative_path}})*"
env_subdir_prefix = "(env (-C|--chdir) {{safe_relative_path}} )?"
env_pre_program = "( (-i|-0|--ignore-environment|--null)| (-u|--unset) [A-Za-z_][A-Za-z0-9_]*| (-C|--chdir) \\S+| [A-Za-z_][A-Za-z0-9_]*=\\S*)*"
demo_iac_manifest_validator = "(\\./)?scripts/validate-manifests\\.sh"
demo_iac_alloy_validator = "node scripts/validate-alloy-configs\\.mjs"
pnpm_filter_scope = "( --filter {{safe_relative_path}})*"
nix_develop_command = "(treefmt{{safe_arg_tail}}|pnpm{{pnpm_filter_scope}} exec eslint \\.|pnpm{{pnpm_script_scope}} (run )?{{package_safe_ops}}|{{demo_iac_manifest_validator}}|{{demo_iac_alloy_validator}}|{{helm_render_chart}}|yamllint{{safe_arg_tail}}|ci/{{safe_relative_path}}\\.sh)"
safe_arg_tail = "( [A-Za-z0-9_.@+=,:/-]+)*"
pnpm_safe_selector = "(-r|--recursive|--filter \\S+|(-C|--dir) {{safe_relative_path}})"
pnpm_script_scope = "( (-r|--recursive|-w|--workspace-root|--if-present|--filter \\S+))*"
vitest_write_arg = "(-u|--update(=true)?|--coverage(=true)?|--coverage\\.enabled(=true)?|--coverage\\.(reportsDirectory|reporter|clean|cleanOnRerun|provider|customProviderModule|reportOnFailure)([.=]\\S+)?|--outputFile([.=]\\S+)?)"
safe_relative_path = "[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*(/[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)*"
timeout_prefix = "(timeout [0-9]+ )?"
env_assignment_prefix = "([A-Za-z_][A-Za-z0-9_]*=\\S* )*"
scratchpad_file_pair = "({{claude_scratchpad_file}} ({{claude_scratchpad_file}}|{{safe_relative_path}})|{{safe_relative_path}} {{claude_scratchpad_file}})"
helm_unsafe_flags = "(--post-renderer|--validate|--kube-context|--kubeconfig|--kube-apiserver|--kube-token|--kube-as-user|--kube-as-group|--dependency-update|--repository-config|--output-dir|--dry-run=server)"
helm_safe_arg_tail = "( (-{1,2}[A-Za-z0-9][A-Za-z0-9-]*(=[A-Za-z0-9_.@+,:%-]+(/[A-Za-z0-9_.@+,:%-]+)*)?|{{safe_relative_path}}|[A-Za-z0-9_.@+-]+(\\[[0-9]+\\])?(\\.[A-Za-z0-9_.@+-]+(\\[[0-9]+\\])?)*=[A-Za-z0-9_.@+,:%-]*(/[A-Za-z0-9_.@+,:%-]+)*|'[A-Za-z0-9_.@+{\\[][^'|;&<>$`\\\\]*'|{{claude_scratchpad_file}}|-))*"
helm_oci_chart_ref = "oci://[A-Za-z0-9][A-Za-z0-9.-]*(/[A-Za-z0-9_.-]+)+( --version [A-Za-z0-9_.+-]+)?"
helm_render_chart = "helm (lint|template|unittest)( [A-Za-z0-9_.-]+)?( \\.|/| \\./| {{safe_relative_path}}| {{helm_oci_chart_ref}}){{helm_safe_arg_tail}}"
safe_stream_redirect = "( 2>\\&1| 2>/dev/null| >/dev/null| >\\&2| 1>\\&2)*"
just_safe_recipes = "(android|android-bindings|android-debug|android-ffi|android-format|android-lint|android-release|android-test|default|format|lint|rust-format|rust-lint|rust-test|test)"
moriarty_cost_report = "(api-pricing|pi cost)( --last-days [0-9]+)?"
pulumi_stack_name = "{{flag_value_name}}(/[A-Za-z0-9_.-]+){0,2}"
pulumi_cwd_flag = "( (-C|--cwd) {{safe_relative_path}})"
flag_value_name = "[A-Za-z0-9_][A-Za-z0-9_.-]*"
example_home = "/home/example"
review_oracle_hidden_path = "^(~|{{example_home}})/src/example-project(/|$)"
wasteful_path = "(/nix/store|/nix|{{example_home}}/src|{{example_home}}|~/|/)"
nonexistent_path = "(/Users/(Shared|runner|devuser)|/home/devuser)"
nix_store_output_root = "/nix/store/[0-9abcdfghijklmnpqrsvwxyz]{32}-[A-Za-z0-9+_?=-][A-Za-z0-9+._?=-]*"
nix_store_output_path = "^{{nix_store_output_root}}(/.*)?$"
nix_store_output_shell_path = "{{nix_store_output_root}}(/[A-Za-z0-9_.@+-]+)*/?"
pi_npm_extension_skills = "npm/node_modules/(@[A-Za-z0-9_+-][A-Za-z0-9_.+-]*/)?[A-Za-z0-9_@+-][A-Za-z0-9_.@+-]*/skills"
pi_installed_skills_path = "^(~|{{example_home}})/\\.pi/agent/({{pi_npm_extension_skills}}|git/github\\.com/example-org/pi-subagents/skills/pi-subagents)(/.*)?$"
pi_mcp_scripting_skill_path = "^(~|{{example_home}})/\\.pi/agent/npm/node_modules/pi-mcp-adapter/skills/mcp-scripting(/|$)"
skill_file_path = "^{{example_home}}/\\.pi/agent/skills/[A-Za-z0-9_-]+/[A-Za-z0-9_-][A-Za-z0-9_.-]*$"
skill_python_script = "^(python|python3) {{example_home}}/\\.pi/agent/skills/[A-Za-z0-9_-]+/scripts/[A-Za-z0-9_-][A-Za-z0-9_.-]*\\.py(\\s+.+)?"
agent_skill_root = "(~|{{example_home}})/(\\.claude/skills|\\.pi/agent/skills)"
post_pr_review_safe = "^{{agent_skill_root}}/post-pr-review/scripts/(pr-context\\.sh|anchor-findings\\.py|findings-from-review\\.py)(\\s+.+)?$"
pr_review_threads_safe = "^{{agent_skill_root}}/pr-review-threads/scripts/fetch-pr-threads\\.sh(\\s+.+)?$"
rust_doc_extract_safe = "^{{agent_skill_root}}/rust-doc-extract/scripts/extract\\.py(\\s+.+)?$"
agent_skill_dir = "{{agent_skill_root}}(/[A-Za-z0-9_-]+){0,2}"
cargo_registry_root = "(~|{{example_home}})/\\.cargo/registry"
helm_cache_root = "(~|/Users/example)/Library/Caches/helm"
go_modcache_root = "(~|{{example_home}})/go/pkg/mod"
dependency_cache_path = "^({{cargo_registry_root}}|{{helm_cache_root}}|{{go_modcache_root}})(/.*)?$"
dependency_cache_shell_path = "({{cargo_registry_root}}/src|{{helm_cache_root}}|{{go_modcache_root}})(/[A-Za-z0-9_@+!][A-Za-z0-9_.@+!-]*)*/?"
cargo_registry_glob_path = "{{cargo_registry_root}}/src(/[A-Za-z0-9_@+*][A-Za-z0-9_.@+*-]*)*/?"
dependency_cache_search_path = "({{dependency_cache_shell_path}}|{{cargo_registry_glob_path}})"
pi_tmpdir = "(/private)?(/tmp|/var/folders/[A-Za-z0-9_+-]+/[A-Za-z0-9_+-]+/T)(/nix-shell\\.[A-Za-z0-9]+)?"
uuid = "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
pi_bash_output_file = "{{pi_tmpdir}}/pi-bash-[0-9a-f]{16}\\.log"
claude_scratchpad_root = "(/private)?/tmp/claude-[0-9]+/[A-Za-z0-9_-]+/{{uuid}}/scratchpad"
claude_scratchpad_file = "{{claude_scratchpad_root}}(/[A-Za-z0-9_@+-][A-Za-z0-9_.@+-]*)+"
claude_scratchpad_tree = "{{claude_scratchpad_root}}(/[A-Za-z0-9_@+-][A-Za-z0-9_.@+-]*)*/?"
claude_task_output_file = "(/private)?/tmp/claude-[0-9]+/[A-Za-z0-9_-]+/{{uuid}}/tasks/[A-Za-z0-9_-]+\\.output"
agent_temp_file = "({{pi_bash_output_file}}|{{claude_scratchpad_file}}|{{claude_task_output_file}})"
agent_temp_path = "^{{agent_temp_file}}$"
pi_mcp_output_file = "{{pi_tmpdir}}/pi-mcp-output-[A-Za-z0-9_-]{6}/output-[0-9a-f]{8}\\.txt"
pi_mcp_output_path = "^{{pi_mcp_output_file}}$"
pi_subagent_output_path = "^{{pi_tmpdir}}/pi-subagents-uid-[0-9]+(/.*)?$"
pi_subagent_status_file = "{{pi_tmpdir}}/pi-subagents-uid-[0-9]+/async-subagent-runs/{{uuid}}/status\\.json"
pi_subagent_run_path = "^{{pi_tmpdir}}/pi-subagent-[A-Za-z0-9]+(/.*)?$"
pi_subagent_run_shell_file = "{{pi_tmpdir}}/pi-subagent-[A-Za-z0-9]+(/[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)*"
claude_tool_results_file = "{{example_home}}/\\.claude/projects/[A-Za-z0-9_-]+/{{uuid}}/tool-results(/.*)?"
claude_tool_results_path = "^{{claude_tool_results_file}}$"
claude_tool_results_shell_file = "{{example_home}}/\\.claude/projects/[A-Za-z0-9_-]+/{{uuid}}/tool-results(/[A-Za-z0-9_@+][A-Za-z0-9_.@+-]*)*"
rg_read_flag = "( -[A-Za-z0-9]+| -[A-Za-z] [0-9]+)"
rg_cwd_flag = "( -(i|l|n|S|w|x))"
grep_read_flag = "( -[ABCEFcilnorvw0-9]+| -[ABC] [0-9]+)"
agent_output_file = "({{agent_temp_file}}|{{claude_tool_results_shell_file}}|{{claude_workflow_record_file}})"
read_only_file_commands = "(cat|head|tail|nl|wc|grep|jq|ls|cut)"
read_only_file_arguments = "( [^/$~\\s]+)*"
read_only_file_redirect = "( 2>/dev/null| 2>\\&1)?"
dev_null_file = "/dev/null"
claude_read_only_file = "(~|{{example_home}})/\\.claude/(CLAUDE\\.md|projects/[A-Za-z0-9_-]+/memory/[A-Za-z0-9_-]+\\.md)"
rg_quoted_pattern = "('[^']*'|\"([^\"$`\\\\]|\\\\.)*\")"
jq_filter_option = "(-[nRscrjaSCMe]+|--(null-input|raw-input|slurp|compact-output|raw-output|raw-output0|join-output|ascii-output|sort-keys|color-output|monochrome-output|tab|unbuffered|stream|stream-errors|seq|exit-status))"
jq_single_quoted_program = "jq( {{jq_filter_option}})* '[^']*'"
jq_safe_input = "((\\./)?{{safe_relative_path}}|\"(\\./)?{{safe_relative_path}}\"|\"?{{agent_output_file}}\"?)"
jq_absolute_input = "\"?/{{safe_relative_path}}\"?"
jq_env_builtin = "env\\b([^:]|$)"
jq_environment_access = "(\\$ENV|[^.A-Za-z0-9_]{{jq_env_builtin}})"
gh_api_get_flag = "( (-f|--raw-field) [A-Za-z0-9_.-]+=([A-Za-z0-9_.:/+-]+|{{rg_quoted_pattern}})| (-H|--header) '[^']*'| --paginate| --cache [0-9]+[smh]?| (--jq|-q) {{gh_jq_program}})"
gh_jq_program = "({{rg_quoted_pattern}}|\\.[A-Za-z0-9_]+(\\.[A-Za-z0-9_]+)*)"
gh_api_endpoint = "/?[A-Za-z0-9._/-]+(\\?[A-Za-z0-9._~%&=+:/-]+)?"
gh_api_readonly_flag = "( (--jq|-q) {{gh_jq_program}}| (-H|--header) '(Accept|X-GitHub-Api-Version): [A-Za-z0-9_.+/;=, -]+'| --paginate| --cache [0-9]+[smh]?| (-i|--include)| --slurp| (-t|--template) {{rg_quoted_pattern}})"
gh_graphql_query = "'(query[ (]|\\{)[^']*'"
gh_graphql_var = "( (-f|--raw-field) [A-Za-z_][A-Za-z0-9_]*=[A-Za-z0-9_.@/-]+| (-F|--field) [A-Za-z_][A-Za-z0-9_]*=[0-9]+)"
sed_safe_abs_file = "({{agent_temp_file}}|{{pi_mcp_output_file}}|{{pi_subagent_status_file}}|{{pi_subagent_run_shell_file}}|{{claude_tool_results_shell_file}}|{{nix_store_output_shell_path}}|{{dependency_cache_shell_path}})"
sed_print_script = "'?[0-9]+(,[0-9]+)?p(;[0-9]+(,[0-9]+)?p)*'?"
sed_subst_script = "'s/[^/']*/[^/']*/[gpiImM0-9]*'"
claude_workflow_record_file = "{{example_home}}/\\.claude/projects/[A-Za-z0-9_-]+/{{uuid}}/(subagents|workflows)(/[A-Za-z0-9_@+-][A-Za-z0-9_.@+-]*)*"
agent_skill_shell_file = "{{agent_skill_root}}(/[A-Za-z0-9_@+-][A-Za-z0-9_.@+-]*){1,3}"
tar_archive_operand = "({{safe_relative_path}}|-)"
tar_member = "[A-Za-z0-9_.+/-]+"
review_oracle_alignment_path = "^(~|{{example_home}})/src/example-project/code_review_alignment\\.md$"
test_review_alignment_path = "^(~|{{example_home}})/src/example-project/test_review_alignment\\.md$"

[[bash_rules]]
name = "bash_rules-000"
pattern = "^{{nonexistent_path}}(/|$)"
action = { "type" = "DenyRedirect", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-001"
pattern = "^\\.config/tools\\.toml$"
action = { "type" = "DenyRedirect", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-002"
pattern = "^/dev/null$"
action = { "type" = "AllowRedirect" }

[[bash_rules]]
name = "bash_rules-003"
pattern = "^&(1|2|-)$"
action = { "type" = "AllowRedirect" }

[[bash_rules]]
name = "bash_rules-004"
pattern = "^{{claude_scratchpad_file}}$"
action = { "type" = "AllowRedirect", "direction" = "input" }

[[bash_rules]]
name = "bash_rules-005"
pattern = "^{{claude_scratchpad_file}}$"
modes = ["plan", "acceptEdits", "auto", "dontAsk", "bypassPermissions"]
action = { "type" = "AllowRedirect", "direction" = "output" }

[[bash_rules]]
name = "bash_rules-006"
pattern = "^"
modes = ["plan", "acceptEdits", "auto", "dontAsk", "bypassPermissions"]
action = { "type" = "AllowRedirect", "allow_local" = true, "direction" = "both" }

[[bash_rules]]
name = "bash_rules-007"
pattern = "^echo\\b"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-008"
pattern = "^jq\\b.*{{jq_environment_access}}"
action = { "type" = "Ask" }

[[bash_rules]]
name = "bash_rules-009"
pattern = "^jq\\b.*'(\\s*(import|include)\\b|[^']*;\\s*(import|include)\\b)"
action = { "type" = "Ask" }

[[bash_rules]]
name = "bash_rules-010"
pattern = "^{{jq_single_quoted_program}} \"?\\$f\"?{{read_only_file_redirect}}$"
action = { "type" = "Ask" }

[[bash_rules]]
name = "bash_rules-011"
pattern = "^{{jq_single_quoted_program}}( {{jq_safe_input}})*{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-012"
pattern = "^{{jq_single_quoted_program}}( {{jq_safe_input}})* {{jq_absolute_input}}( ({{jq_safe_input}}|{{jq_absolute_input}}))*{{read_only_file_redirect}}$"
action = { "type" = "Ask" }

[[bash_rules]]
name = "bash_rules-013"
pattern = "(^|[\\s=])[\"']?\\\\?{{wasteful_path}}[\"']?(\\s|$)"
action = { "type" = "Deny", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-014"
pattern = "(^|[\\s=])[\"']?\\\\?{{nonexistent_path}}(/|[\"']|\\s|$)"
action = { "type" = "Deny", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-015"
pattern = "^ls ~/src/example-project/$"
action = { "type" = "Deny", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-016"
pattern = "^cd(\\s|$)"
action = { "type" = "Deny", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-017"
pattern = "^cargo\\b.*--manifest-path\\b"
action = { "type" = "Deny", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-018"
pattern = "(^|[\\s=/])[\"']?\\.\\.(/|[\\s\"']|$)"
action = { "type" = "Deny", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-019"
pattern = "^{{example_home}}/\\.pi/agent/agents/crate-fetch($|\\s)"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-020"
pattern = "^crate-fetch ('https://crates\\.io/api/v1/crates/[A-Za-z0-9_-]+'|https://crates\\.io/api/v1/crates/[A-Za-z0-9_-]+){{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-021"
pattern = "{{skill_python_script}}"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-022"
pattern = "{{post_pr_review_safe}}"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-023"
pattern = "{{pr_review_threads_safe}}"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-024"
pattern = "{{rust_doc_extract_safe}}"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-025"
pattern = "^find ({{agent_skill_dir}}|{{claude_scratchpad_tree}})( -maxdepth [0-9]+| -type [fdl]| -i?name ({{rg_quoted_pattern}}|[A-Za-z0-9_.-]+))*{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-026"
pattern = "^ls( -[1aAlhFR]+)* {{agent_skill_dir}}/?$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-027"
pattern = "^(/bin/)?bash --version$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-028"
pattern = "^node scripts/render-demo-charts\\.mjs( > ?/dev/null)?$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-029"
pattern = "^rg\\b.*--(pre|hostname-bin)(=|\\s|$)"
action = { "type" = "Ask" }

[[bash_rules]]
name = "bash_rules-030"
pattern = "^rg\\b('[^']*'|\"([^\"\\\\]|\\\\.)*\"|[^'\"])*\\s-[A-Za-z0-9]*r"
action = { "type" = "Deny", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-031"
pattern = "^rg\\b('[^']*'|\"([^\"\\\\]|\\\\.)*\"|[^'\"])*\\s(-[A-Za-z0-9]*f\\S*|--file(=|\\s))"
action = { "type" = "Ask" }

[[bash_rules]]
name = "bash_rules-032"
pattern = "^rg{{rg_cwd_flag}}* {{rg_quoted_pattern}}{{rg_cwd_flag}}*{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-033"
pattern = "^grep{{grep_read_flag}}* {{rg_quoted_pattern}}{{grep_read_flag}}*( \\.| (\\./)?{{safe_relative_path}})+{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-034"
pattern = "^env{{env_pre_program}} (\\S*/)?[gmn]?awk\\b"
action = { "type" = "Deny", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-035"
pattern = "^env{{env_pre_program}} (\\S*/)?sed\\b"
action = { "type" = "Deny", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-036"
pattern = "^{{env_assignment_prefix}}(\\S*/)?[gmn]?awk\\b"
action = { "type" = "Deny", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-037"
pattern = "^{{timeout_prefix}}{{env_assignment_prefix}}((npx( --no-install)?( -y)?|(pnpm|npm|yarn|bun)( \\S+)* exec) )?(\\./)?(node_modules/\\.bin/)?prettier\\b"
action = { "type" = "Deny", "value" = "Benchmark policy denial" }

[[bash_rules]]
name = "bash_rules-038"
pattern = "^{{read_only_file_commands}}\\b{{read_only_file_arguments}} \"?{{agent_output_file}}\"?{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-039"
pattern = "^(rg|grep){{rg_read_flag}}* {{rg_quoted_pattern}}{{rg_read_flag}}*( \"?{{agent_output_file}}\"?| {{claude_read_only_file}})+{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-040"
pattern = "^mkdir -p {{claude_scratchpad_file}}$"
modes = ["plan", "acceptEdits", "auto", "dontAsk", "bypassPermissions"]
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-041"
pattern = "^cp {{scratchpad_file_pair}}$"
modes = ["plan", "acceptEdits", "auto", "dontAsk", "bypassPermissions"]
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-042"
pattern = "^diff( -[a-zA-Z]+)* {{scratchpad_file_pair}}{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-043"
pattern = "^{{read_only_file_commands}}\\b{{read_only_file_arguments}} {{pi_mcp_output_file}}{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-044"
pattern = "^{{read_only_file_commands}}\\b{{read_only_file_arguments}} {{pi_subagent_status_file}}{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-045"
pattern = "^{{read_only_file_commands}}\\b{{read_only_file_arguments}} {{pi_subagent_run_shell_file}}{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-046"
pattern = "^{{read_only_file_commands}}\\b{{read_only_file_arguments}} {{agent_skill_shell_file}}{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

[[bash_rules]]
name = "bash_rules-047"
pattern = "^{{read_only_file_commands}}\\b{{read_only_file_arguments}} {{nix_store_output_shell_path}}{{read_only_file_redirect}}$"
action = { "type" = "Allow" }

